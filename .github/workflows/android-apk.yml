name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeFlow-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Renombrar APK
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/AnimeFlow-arm64.apk
      - name: Publicar APK como release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AnimeFlow APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
